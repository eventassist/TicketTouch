name: tickettouch
description: Ticket sales for Events.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ">=2.17.6 <3.0.0"

module:
  androidX: true

dependencies:
  # flutter
  flutter:
    sdk: flutter
  # icons & fonts
  flutter_launcher_icons: ^0.10.0 #flutter pub run flutter_launcher_icons:main
  cupertino_icons: ^1.0.2
  google_fonts: ^3.0.1
  font_awesome_flutter: ^10.2.1
  # utils
  shared_preferences: ^2.0.15
  rive_splash_screen: ^0.1.1
  rive: ^0.9.1
  hidden_drawer_menu: ^3.0.1
  smooth_page_indicator: ^1.0.0
  settings_ui: ^2.0.0
  theme_mode_handler: ^3.0.0
  # firebase
  flutterfire: ^0.0.1
  flutterfire_cli: ^0.2.6
  flutterfire_ui: ^0.4.3+9
  firebase_core: ^1.22.0
  firebase_remote_config: ^2.0.17
  cloud_firestore: ^3.4.8
  # google
  google_ml_kit: ^0.12.0
  # auth
  firebase_auth: ^3.9.0
  google_sign_in: ^5.4.2
  flutter_facebook_auth: ^4.4.1+1
  sign_in_with_apple: ^3.0.0
  crypto: ^3.0.1
  twitter_login: ^4.0.1
  # state management
  provider: ^6.0.3

# dev
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

# app icons
flutter_icons:
  image_path: "assets/logos/1024.png"
  android: true
  min_sdk_android: 28
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/logos/1024.png"
    background_color: "#00a9ce"
    theme_color: "#00a9ce"

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - assets/animations/
    - assets/images/
    - assets/logos/

    # animations
    - assets/animations/splash_animation.riv

    # images
    - assets/images/

    # logos
    - assets/logos/1024.png
    - assets/logos/google_logo.png


